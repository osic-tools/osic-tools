# Every GitHub repository the IIC-OSIC-TOOLS build depends on.
#
# Generated by scripts/discover_repos.py, which runs nightly. Hand edits to
# `ignore` and `fork_name_overrides` are preserved, as is any field on an
# existing entry that the build does not own.
#
# origin:  tool_metadata | build_script | pip | submodule | source | manual
# pinned:  the commit or tag the build checks out, where one is pinned.
org: osic-tools
source:
  repo: iic-jku/IIC-OSIC-TOOLS
  ref: main
ignore:
- gcc-mirror/gcc
- hpretl/verilog-covered
- llvm/llvm-project
- povik/sv-elab
- wbx-github/uclibc-ng
